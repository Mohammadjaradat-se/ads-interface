<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ads Interface</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>📢 Ads Platform</h1>
        <p>Best deals in one place</p>
    </header>

    <section class="ads-container">

        <div class="ad-card">
            <img src="./images/phoneAd.jpg" alt="Phone Ad">
            <h2>Phone Advertisement</h2>
            <p>Smartphone with powerful features at a great price.</p>
            <button>View Details</button>
        </div>

        <div class="ad-card">
            <img src="./images/carAd.jpg" alt="Car Ad">
            <h2>Car Advertisement</h2>
            <p>Modern car with 2 years warranty.</p>
            <button>View Details</button>
        </div>

        <div class="ad-card">
            <img src="./images/LaptopAd.jpg" alt="Laptop Ad">
            <h2>Laptop Advertisement</h2>
            <p>High-performance laptop for work and study.</p>
            <button>View Details</button>
        </div>

    </section>

    <footer>
        <p>© 2026 All rights reserved</p>
    </footer>

</body>
</html>
